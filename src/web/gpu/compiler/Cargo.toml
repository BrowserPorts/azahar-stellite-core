[package]
name = "azahar-shader-compiler"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
naga = { path = "../../../../externals/wgpu/naga", features = ["glsl-in", "wgsl-in", "wgsl-out"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
